name: Passport Queue Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: passport-queue-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_SERVICE: "Закордонний паспорт та (або) ID-картка"
          QUEUE_URL: "https://london.pasport.org.ua/solutions/e-queue"
          RUN_ONCE: "true"
          HEADLESS: "true"
          SEND_STARTUP_MESSAGE: "false"
        run: python passport_queue_bot.py

      - name: Save notification state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update queue monitor state [skip ci]"
            git push
          else
            echo "State unchanged"
          fi
